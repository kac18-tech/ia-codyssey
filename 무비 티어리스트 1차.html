<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 영화 티어리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tier-row { min-height: 120px; transition: background-color 0.2s; }
        .drag-over { background-color: rgba(255, 255, 255, 0.1); outline: 2px dashed #666; }
        .movie-card { cursor: grab; transition: transform 0.2s; }
        .movie-card:active { cursor: grabbing; }
        .movie-card:hover { transform: scale(1.05); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body class="bg-zinc-900 text-white min-h-screen p-4 md:p-8">

    <!-- 헤더 및 설정 -->
    <header class="max-w-6xl mx-auto mb-8">
        <h1 class="text-3xl font-bold mb-4 text-center text-yellow-500">🎬 MOVIE TIER LIST</h1>
        
        <div class="bg-zinc-800 p-4 rounded-lg shadow-lg flex flex-col md:flex-row gap-4 items-center">
            <div class="flex-1 w-full">
                <label class="block text-xs text-zinc-400 mb-1">TMDB API KEY</label>
                <input type="password" id="apiKey" placeholder="API 키를 입력하세요" 
                    class="w-full bg-zinc-700 border border-zinc-600 rounded px-3 py-2 focus:outline-none focus:border-yellow-500">
            </div>
            <div class="flex-[2] w-full">
                <label class="block text-xs text-zinc-400 mb-1">영화 검색</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="영화 제목을 입력하세요..." 
                        class="flex-1 bg-zinc-700 border border-zinc-600 rounded px-3 py-2 focus:outline-none focus:border-yellow-500">
                    <button onclick="searchMovies()" class="bg-yellow-600 hover:bg-yellow-500 px-6 py-2 rounded font-bold transition">검색</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 gap-8">
        
        <!-- 검색 결과 영역 -->
        <section>
            <h2 class="text-xl font-semibold mb-3 flex items-center gap-2">
                <span class="bg-blue-500 w-2 h-6 rounded-full"></span> 검색 결과
                <span class="text-sm font-normal text-zinc-400">(포스터를 티어로 드래그하세요)</span>
            </h2>
            <div id="searchResults" class="flex gap-4 overflow-x-auto pb-4 min-h-[180px] bg-zinc-800/50 rounded-xl p-4 border border-zinc-700/50">
                <p class="text-zinc-500 m-auto">영화를 검색하면 여기에 나타납니다.</p>
            </div>
        </section>

        <!-- 티어 리스트 영역 -->
        <section class="flex flex-col gap-2">
            <!-- S Tier -->
            <div class="flex border border-zinc-700 rounded-lg overflow-hidden shadow-xl">
                <div class="w-24 md:w-32 bg-red-600 flex items-center justify-center text-2xl md:text-4xl font-black text-black">S</div>
                <div id="tier-S" class="tier-row flex-1 bg-zinc-800 p-3 flex flex-wrap gap-3" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- A Tier -->
            <div class="flex border border-zinc-700 rounded-lg overflow-hidden shadow-xl">
                <div class="w-24 md:w-32 bg-orange-500 flex items-center justify-center text-2xl md:text-4xl font-black text-black">A</div>
                <div id="tier-A" class="tier-row flex-1 bg-zinc-800 p-3 flex flex-wrap gap-3" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- B Tier -->
            <div class="flex border border-zinc-700 rounded-lg overflow-hidden shadow-xl">
                <div class="w-24 md:w-32 bg-yellow-400 flex items-center justify-center text-2xl md:text-4xl font-black text-black">B</div>
                <div id="tier-B" class="tier-row flex-1 bg-zinc-800 p-3 flex flex-wrap gap-3" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- C Tier -->
            <div class="flex border border-zinc-700 rounded-lg overflow-hidden shadow-xl">
                <div class="w-24 md:w-32 bg-green-500 flex items-center justify-center text-2xl md:text-4xl font-black text-black">C</div>
                <div id="tier-C" class="tier-row flex-1 bg-zinc-800 p-3 flex flex-wrap gap-3" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- D Tier -->
            <div class="flex border border-zinc-700 rounded-lg overflow-hidden shadow-xl">
                <div class="w-24 md:w-32 bg-blue-500 flex items-center justify-center text-2xl md:text-4xl font-black text-black">D</div>
                <div id="tier-D" class="tier-row flex-1 bg-zinc-800 p-3 flex flex-wrap gap-3" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
        </section>
    </main>

    <script>
        const IMG_BASE_URL = "https://image.tmdb.org/t/p/w200";

        // 영화 검색 함수
        async function searchMovies() {
            const apiKey = document.getElementById('apiKey').value;
            const query = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('searchResults');

            if (!apiKey) {
                alert("TMDB API 키를 먼저 입력해주세요!");
                return;
            }
            if (!query) return;

            resultsContainer.innerHTML = '<p class="text-zinc-500 m-auto">검색 중...</p>';

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}&language=ko-KR`);
                const data = await response.json();

                resultsContainer.innerHTML = '';
                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-zinc-500 m-auto">검색 결과가 없습니다.</p>';
                    return;
                }

                data.results.forEach(movie => {
                    if (!movie.poster_path) return; // 포스터 없는 영화 제외
                    
                    const movieEl = document.createElement('div');
                    movieEl.className = 'movie-card flex-shrink-0 w-24 md:w-32 shadow-lg';
                    movieEl.draggable = true;
                    movieEl.id = 'movie-' + movie.id;
                    movieEl.innerHTML = `
                        <img src="${IMG_BASE_URL + movie.poster_path}" alt="${movie.title}" class="rounded-md w-full h-auto pointer-events-none">
                        <p class="text-[10px] mt-1 truncate text-zinc-400">${movie.title}</p>
                    `;
                    
                    // 드래그 시작 이벤트
                    movieEl.ondragstart = (e) => {
                        e.dataTransfer.setData("text/plain", movieEl.id);
                    };

                    resultsContainer.appendChild(movieEl);
                });
            } catch (error) {
                alert("에러가 발생했습니다. API 키를 확인해주세요.");
                console.error(error);
            }
        }

        // 드래그 앤 드롭 로직
        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const id = e.dataTransfer.getData("text/plain");
            const draggableElement = document.getElementById(id);
            const dropzone = e.currentTarget;
            
            // 드롭된 위치로 요소 이동
            dropzone.appendChild(draggableElement);
        }

        // 엔터키 검색 지원
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovies();
        });
    </script>
</body>
</html>
