<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트 메이커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 1. 배경 밝기 조정 (오버레이 투명도 0.8 -> 0.5) */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Pretendard', sans-serif;
        }

        /* 2. 왜곡된 유리 느낌의 티어 레이블 */
        .tier-label {
            width: 80px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            /* 유리 질감 핵심: 강한 블러와 반투명 배경 */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px) saturate(150%);
            -webkit-backdrop-filter: blur(15px) saturate(150%);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (min-width: 768px) { .tier-label { width: 120px; font-size: 3.5rem; } }

        /* 티어별 글자 색상만 강조 */
        .tier-s { color: #ff4d4d; text-shadow: 0 0 15px rgba(255, 77, 77, 0.6); }
        .tier-a { color: #ff9f43; text-shadow: 0 0 15px rgba(255, 159, 67, 0.6); }
        .tier-b { color: #feca57; text-shadow: 0 0 15px rgba(254, 202, 87, 0.6); }
        .tier-c { color: #1dd1a1; text-shadow: 0 0 15px rgba(29, 209, 161, 0.6); }
        .tier-d { color: #54a0ff; text-shadow: 0 0 15px rgba(84, 160, 255, 0.6); }

        /* 행 디자인: 배경을 더 투명하게 */
        .tier-row { 
            min-height: 150px; 
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .drag-over { background: rgba(255, 255, 255, 0.15); }
        
        .movie-card { cursor: grab; transition: all 0.2s; }
        .movie-card:hover { transform: scale(1.05); z-index: 10; }
        
        /* 전체적인 유리 패널 느낌 */
        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-white min-h-screen p-4 md:p-8">

    <header class="max-w-6xl mx-auto mb-12">
        <h1 class="text-4xl md:text-6xl font-black mb-8 text-center tracking-tighter italic">
            <span class="text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">MOVIE</span> 
            <span class="text-white border-b-4 border-yellow-400">TIER LIST</span>
        </h1>
        
        <div class="search-box p-4 rounded-2xl shadow-2xl max-w-2xl mx-auto flex gap-3">
            <input type="hidden" id="apiKey" value="125e5696186b6ae8adc855c50fb7b6bd">
            <input type="text" id="searchInput" placeholder="영화를 검색하여 티어표를 완성하세요..." 
                class="flex-1 bg-transparent border-none px-4 py-2 focus:outline-none text-lg placeholder:text-zinc-400">
            <button onclick="searchMovies()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-6 py-2 rounded-xl font-bold transition-all transform active:scale-95">검색</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-6">
        <!-- 검색 결과 영역 -->
        <section>
            <div id="searchResults" class="flex gap-4 overflow-x-auto pb-4 min-h-[200px] px-2 scrollbar-hide">
                <p class="text-zinc-300 m-auto text-lg font-light">검색 결과가 여기에 표시됩니다.</p>
            </div>
        </section>

        <!-- 티어표 영역 -->
        <section class="flex flex-col gap-3">
            <!-- S Tier -->
            <div class="flex glass-panel rounded-2xl overflow-hidden shadow-xl">
                <div class="tier-label tier-s">S</div>
                <div id="tier-S" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- A Tier -->
            <div class="flex glass-panel rounded-2xl overflow-hidden shadow-xl">
                <div class="tier-label tier-a">A</div>
                <div id="tier-A" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- B Tier -->
            <div class="flex glass-panel rounded-2xl overflow-hidden shadow-xl">
                <div class="tier-label tier-b">B</div>
                <div id="tier-B" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- C Tier -->
            <div class="flex glass-panel rounded-2xl overflow-hidden shadow-xl">
                <div class="tier-label tier-c">C</div>
                <div id="tier-C" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- D Tier -->
            <div class="flex glass-panel rounded-2xl overflow-hidden shadow-xl">
                <div class="tier-label tier-d">D</div>
                <div id="tier-D" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
        </section>
    </main>

    <script>
        const IMG_BASE_URL = "https://image.tmdb.org/t/p/w200";

        async function searchMovies() {
            const apiKey = document.getElementById('apiKey').value;
            const query = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('searchResults');

            if (!query) return;

            resultsContainer.innerHTML = '<div class="m-auto animate-pulse text-yellow-500 font-bold">영화를 찾는 중...</div>';

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}&language=ko-KR`);
                const data = await response.json();

                resultsContainer.innerHTML = '';
                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-zinc-300 m-auto">결과가 없습니다.</p>';
                    return;
                }

                data.results.forEach(movie => {
                    if (!movie.poster_path) return;
                    
                    const movieEl = document.createElement('div');
                    movieEl.className = 'movie-card flex-shrink-0 w-24 md:w-32';
                    movieEl.draggable = true;
                    movieEl.id = 'movie-' + movie.id + '-' + Math.random().toString(36).substr(2, 5);
                    movieEl.innerHTML = `
                        <img src="${IMG_BASE_URL + movie.poster_path}" alt="${movie.title}" 
                            class="rounded-lg w-full h-auto pointer-events-none shadow-lg border border-white/10">
                        <p class="text-[10px] mt-2 font-medium text-zinc-300 truncate text-center">${movie.title}</p>
                    `;
                    
                    movieEl.ondragstart = (e) => {
                        e.dataTransfer.setData("text/plain", movieEl.id);
                        movieEl.style.opacity = "0.4";
                    };
                    movieEl.ondragend = () => movieEl.style.opacity = "1";

                    resultsContainer.appendChild(movieEl);
                });
            } catch (error) {
                alert("오류가 발생했습니다.");
            }
        }

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const id = e.dataTransfer.getData("text/plain");
            const draggableElement = document.getElementById(id);
            if (draggableElement) {
                e.currentTarget.appendChild(draggableElement);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovies();
        });
    </script>
</body>
</html>
