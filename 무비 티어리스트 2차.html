<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트 메이커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 배경 이미지 설정 */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 네온 글래스 효과 */
        .tier-label {
            width: 80px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            backdrop-blur: md;
        }

        @media (min-width: 768px) { .tier-label { width: 120px; font-size: 3rem; } }

        /* 각 티어별 네온 테두리 및 그림자 */
        .tier-s { background: rgba(239, 68, 68, 0.2); border-right: 4px solid #ef4444; color: #ef4444; box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.3); }
        .tier-a { background: rgba(249, 115, 22, 0.2); border-right: 4px solid #f97316; color: #f97316; box-shadow: inset 0 0 20px rgba(249, 115, 22, 0.3); }
        .tier-b { background: rgba(250, 204, 21, 0.2); border-right: 4px solid #facc15; color: #facc15; box-shadow: inset 0 0 20px rgba(250, 204, 21, 0.3); }
        .tier-c { background: rgba(34, 197, 94, 0.2); border-right: 4px solid #22c55e; color: #22c55e; box-shadow: inset 0 0 20px rgba(34, 197, 94, 0.3); }
        .tier-d { background: rgba(59, 130, 246, 0.2); border-right: 4px solid #3b82f6; color: #3b82f6; box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.3); }

        .tier-row { min-height: 140px; transition: all 0.3s; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(5px); }
        .drag-over { background: rgba(255, 255, 255, 0.1); border: 2px dashed rgba(255, 255, 255, 0.3); }
        
        .movie-card { cursor: grab; transition: all 0.2s; }
        .movie-card:hover { transform: scale(1.1) rotate(2deg); z-index: 50; }
        
        /* 유리창 느낌의 컨테이너 */
        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="text-white min-h-screen p-4 md:p-8">

    <header class="max-w-6xl mx-auto mb-10">
        <h1 class="text-4xl md:text-5xl font-black mb-8 text-center tracking-tighter italic">
            <span class="text-yellow-500">MOVIE</span> <span class="text-white border-b-4 border-yellow-500">TIER LIST</span>
        </h1>
        
        <div class="glass-panel p-6 rounded-2xl shadow-2xl max-w-2xl mx-auto">
            <input type="hidden" id="apiKey" value="125e5696186b6ae8adc855c50fb7b6bd">
            
            <div class="w-full">
                <div class="flex gap-3">
                    <input type="text" id="searchInput" placeholder="평가하고 싶은 영화를 검색하세요..." 
                        class="flex-1 bg-white/10 border border-white/20 rounded-xl px-5 py-3 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-lg transition-all">
                    <button onclick="searchMovies()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-8 py-3 rounded-xl font-black transition-all transform active:scale-95">검색</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-10">
        <!-- 검색 결과 영역 -->
        <section>
            <h2 class="text-sm font-bold mb-4 uppercase tracking-widest text-zinc-400 flex items-center gap-2">
                <span class="w-8 h-[1px] bg-zinc-600"></span> Search Results
            </h2>
            <div id="searchResults" class="flex gap-5 overflow-x-auto pb-6 min-h-[220px] px-2">
                <p class="text-zinc-500 m-auto text-lg italic">영화를 검색하면 포스터가 여기에 나타납니다.</p>
            </div>
        </section>

        <!-- 티어표 영역 -->
        <section class="flex flex-col gap-4">
            <!-- S Tier -->
            <div class="flex glass-panel rounded-xl overflow-hidden shadow-2xl border border-white/5">
                <div class="tier-label tier-s">S</div>
                <div id="tier-S" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- A Tier -->
            <div class="flex glass-panel rounded-xl overflow-hidden shadow-2xl border border-white/5">
                <div class="tier-label tier-a">A</div>
                <div id="tier-A" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- B Tier -->
            <div class="flex glass-panel rounded-xl overflow-hidden shadow-2xl border border-white/5">
                <div class="tier-label tier-b">B</div>
                <div id="tier-B" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- C Tier -->
            <div class="flex glass-panel rounded-xl overflow-hidden shadow-2xl border border-white/5">
                <div class="tier-label tier-c">C</div>
                <div id="tier-C" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
            <!-- D Tier -->
            <div class="flex glass-panel rounded-xl overflow-hidden shadow-2xl border border-white/5">
                <div class="tier-label tier-d">D</div>
                <div id="tier-D" class="tier-row flex-1 p-4 flex flex-wrap gap-4" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
        </section>
    </main>

    <footer class="max-w-6xl mx-auto mt-20 mb-10 text-center">
        <p class="text-zinc-500 text-xs tracking-widest uppercase">Powered by TMDB API • Designed for Movie Lovers</p>
    </footer>

    <script>
        const IMG_BASE_URL = "https://image.tmdb.org/t/p/w200";

        async function searchMovies() {
            const apiKey = document.getElementById('apiKey').value;
            const query = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('searchResults');

            if (!query) return;

            resultsContainer.innerHTML = '<div class="m-auto loader border-4 border-yellow-500 border-t-transparent rounded-full w-10 h-10 animate-spin"></div>';

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}&language=ko-KR`);
                const data = await response.json();

                resultsContainer.innerHTML = '';
                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-zinc-500 m-auto">검색 결과가 없습니다.</p>';
                    return;
                }

                data.results.forEach(movie => {
                    if (!movie.poster_path) return;
                    
                    const movieEl = document.createElement('div');
                    movieEl.className = 'movie-card flex-shrink-0 w-28 md:w-36';
                    movieEl.draggable = true;
                    movieEl.id = 'movie-' + movie.id + '-' + Math.random().toString(36).substr(2, 5);
                    movieEl.innerHTML = `
                        <img src="${IMG_BASE_URL + movie.poster_path}" alt="${movie.title}" 
                            class="rounded-lg w-full h-auto pointer-events-none shadow-2xl border border-white/10">
                        <p class="text-[11px] mt-2 font-medium text-zinc-300 truncate text-center">${movie.title}</p>
                    `;
                    
                    movieEl.ondragstart = (e) => {
                        e.dataTransfer.setData("text/plain", movieEl.id);
                        movieEl.style.opacity = "0.5";
                    };
                    movieEl.ondragend = () => movieEl.style.opacity = "1";

                    resultsContainer.appendChild(movieEl);
                });
            } catch (error) {
                alert("영화를 불러오는 중 오류가 발생했습니다.");
            }
        }

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const id = e.dataTransfer.getData("text/plain");
            const draggableElement = document.getElementById(id);
            if (draggableElement) {
                e.currentTarget.appendChild(draggableElement);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovies();
        });
    </script>
</body>
</html>
