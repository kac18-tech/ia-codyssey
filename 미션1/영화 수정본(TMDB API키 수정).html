<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트 메이커</title>
    <!-- 드래그 앤 드롭 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1014;
            --panel-bg: #1a1b22;
            --text-color: #ececec;
            --s-tier: #ff4d4d;
            --a-tier: #ffaf4d;
            --b-tier: #ffeb4d;
            --c-tier: #4dff88;
            --d-tier: #4da6ff;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-share {
            background-color: #3182f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        /* 티어 보드 스타일 */
        #tier-board {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
        }

        .tier-row {
            display: flex;
            min-height: 110px;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .tier-label {
            width: 80px;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: #1a1b22;
        }

        .tier-content {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            min-height: 90px;
        }

        /* 티어별 색상 */
        .s { background-color: var(--s-tier); }
        .a { background-color: var(--a-tier); }
        .b { background-color: var(--b-tier); }
        .c { background-color: var(--c-tier); }
        .d { background-color: var(--d-tier); }

        /* 검색 영역 */
        #search-section {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #000;
            color: white;
        }

        #search-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #search-results {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 140px;
            padding: 15px;
            border: 2px dashed #333;
            border-radius: 8px;
            justify-content: center;
        }

        /* 영화 카드 스타일 */
        .movie-card {
            width: 80px;
            cursor: grab;
            position: relative;
            transition: transform 0.1s;
        }

        .movie-card img {
            width: 100%;
            border-radius: 4px;
            display: block;
        }

        .movie-card .title {
            font-size: 10px;
            text-align: center;
            margin-top: 4px;
            color: #aaa;
            display: none; /* 티어표 안에서는 제목 숨김 */
        }

        #search-results .movie-card { width: 90px; }
        #search-results .movie-card .title { display: block; }

        .sortable-ghost { opacity: 0.3; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 영화 티어리스트 메이커</h1>
        <p>영화를 검색하고 드래그하여 등급을 매겨보세요!</p>
        <button class="btn-share" onclick="copyShareLink()">🔗 현재 티어표 링크 복사</button>
    </header>

    <div id="tier-board">
        <div class="tier-row">
            <div class="tier-label s">S</div>
            <div id="tier-s" class="tier-content" data-tier="S"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label a">A</div>
            <div id="tier-a" class="tier-content" data-tier="A"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label b">B</div>
            <div id="tier-b" class="tier-content" data-tier="B"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label c">C</div>
            <div id="tier-c" class="tier-content" data-tier="C"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label d">D</div>
            <div id="tier-d" class="tier-content" data-tier="D"></div>
        </div>
    </div>

    <section id="search-section">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="영화 제목 입력 (예: 어벤져스)">
            <button id="search-btn" onclick="searchMovies()">검색</button>
        </div>
        <div id="search-results">
            <p style="color:#666;">검색 결과가 여기에 표시됩니다.</p>
        </div>
    </section>

    <script>
        const API_KEY = '125e5696186b6ae8adc855c50fb7b6bd'; 
        const IMG_URL = 'https://image.tmdb.org/t/p/w200';

        // 1. 드래그 앤 드롭 설정
        const containers = document.querySelectorAll('.tier-content, #search-results');
        containers.forEach(el => {
            new Sortable(el, {
                group: 'movies',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: updateURL // 이동할 때마다 주소창 업데이트
            });
        });

        // 2. 영화 검색
        async function searchMovies() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=ko-KR`);
            const data = await res.json();
            
            const results = document.getElementById('search-results');
            results.innerHTML = '';

            data.results.forEach(movie => {
                if (!movie.poster_path) return;
                const card = createCard(movie.id, movie.poster_path, movie.title);
                results.appendChild(card);
            });
        }

        function createCard(id, poster, title) {
            const div = document.createElement('div');
            div.className = 'movie-card';
            div.dataset.id = id;
            div.dataset.poster = poster;
            
            div.innerHTML = `
                <img src="${IMG_URL}${poster}" alt="${title}" title="${title}">
                <div class="title">${title}</div>
            `;
            return div;
        }

        // 3. URL에 상태 저장 (공유 기능)
        function updateURL() {
            const state = {};
            document.querySelectorAll('.tier-content').forEach(tier => {
                const name = tier.dataset.tier;
                const movies = Array.from(tier.children).map(c => `${c.dataset.id}:${c.dataset.poster}`);
                if (movies.length > 0) state[name] = movies;
            });

            const encoded = btoa(encodeURIComponent(JSON.stringify(state)));
            const url = new URL(window.location);
            url.searchParams.set('data', encoded);
            window.history.replaceState({}, '', url);
        }

        // 4. URL에서 데이터 불러오기
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (!data) return;

            try {
                const state = JSON.parse(decodeURIComponent(atob(data)));
                for (const tier in state) {
                    const container = document.querySelector(`[data-tier="${tier}"]`);
                    state[tier].forEach(m => {
                        const [id, poster] = m.split(':');
                        container.appendChild(createCard(id, poster, ''));
                    });
                }
            } catch (e) { console.error("데이터 로드 실패", e); }
        }

        function copyShareLink() {
            updateURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('공유 링크가 복사되었습니다! 이 주소를 친구에게 보내세요.');
            });
        }

        // 엔터키 검색
        document.getElementById('search-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchMovies();
        });

        window.onload = loadFromURL;
    </script>
</body>
</html>
