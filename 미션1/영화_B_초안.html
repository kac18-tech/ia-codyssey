<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트 메이커</title>
    <!-- SortableJS: 부드러운 드래그 앤 드롭을 위한 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1b;
            --card-bg: #2b2b2b;
            --text-color: #ffffff;
            --s-tier: #ff7f7f;
            --a-tier: #ffbf7f;
            --b-tier: #ffff7f;
            --c-tier: #7fff7f;
            --d-tier: #7fbfff;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        #share-btn { background-color: #4a90e2; color: white; }
        #search-btn { background-color: #e50914; color: white; }

        /* 티어 리스트 스타일 */
        #tier-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 40px;
        }

        .tier-row {
            display: flex;
            min-height: 120px;
            background-color: #000;
            border: 1px solid #333;
        }

        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .tier-content {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            min-height: 100px;
        }

        /* 티어별 색상 */
        .s { background-color: var(--s-tier); }
        .a { background-color: var(--a-tier); }
        .b { background-color: var(--b-tier); }
        .c { background-color: var(--c-tier); }
        .d { background-color: var(--d-tier); }

        /* 검색 구역 스타일 */
        #search-section {
            width: 100%;
            max-width: 1000px;
            background-color: #262626;
            padding: 20px;
            border-radius: 10px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        #search-results {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 150px;
            padding: 10px;
            border: 2px dashed #444;
            border-radius: 5px;
            justify-content: center;
        }

        /* 영화 카드 스타일 */
        .movie-card {
            width: 100px;
            cursor: grab;
            transition: transform 0.2s;
            position: relative;
        }

        .movie-card:active { cursor: grabbing; }

        .movie-card img {
            width: 100%;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .movie-card .title {
            font-size: 11px;
            text-align: center;
            margin-top: 5px;
            display: none; /* 티어표에서는 이미지만 표시 */
        }

        #search-results .movie-card .title {
            display: block; /* 검색 결과에서는 제목 표시 */
        }

        .sortable-ghost { opacity: 0.4; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 영화 티어리스트 메이커</h1>
        <p>영화를 검색하고 드래그하여 나만의 등급을 매겨보세요!</p>
        <div class="controls">
            <button id="share-btn" onclick="copyShareLink()">🔗 현재 리스트 공유하기</button>
        </div>
    </header>

    <main id="tier-container">
        <div class="tier-row">
            <div class="tier-label s">S</div>
            <div id="tier-s" class="tier-content" data-tier="S"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label a">A</div>
            <div id="tier-a" class="tier-content" data-tier="A"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label b">B</div>
            <div id="tier-b" class="tier-content" data-tier="B"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label c">C</div>
            <div id="tier-c" class="tier-content" data-tier="C"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label d">D</div>
            <div id="tier-d" class="tier-content" data-tier="D"></div>
        </div>
    </main>

    <section id="search-section">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="영화 제목을 입력하세요...">
            <button id="search-btn" onclick="searchMovies()">검색</button>
        </div>
        <div id="search-results">
            <!-- 검색 결과가 여기에 표시됨 -->
        </div>
    </section>

    <script>
        // [필수] TMDB API 키를 여기에 입력하세요
        const API_KEY = 'YOUR_TMDB_API_KEY'; 
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w200';

        // 1. 드래그 앤 드롭 초기화
        const tierContainers = document.querySelectorAll('.tier-content, #search-results');
        tierContainers.forEach(container => {
            new Sortable(container, {
                group: 'shared',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: saveStateToURL // 이동이 끝날 때마다 URL 업데이트
            });
        });

        // 2. 영화 검색 기능
        async function searchMovies() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            if (API_KEY === 'YOUR_TMDB_API_KEY') {
                alert('TMDB API 키를 코드에 입력해야 검색 기능이 작동합니다!');
                return;
            }

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=ko-KR`);
                const data = await response.json();
                displayResults(data.results);
            } catch (error) {
                console.error('검색 오류:', error);
            }
        }

        function displayResults(movies) {
            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '';

            movies.forEach(movie => {
                if (!movie.poster_path) return;
                const card = createMovieCard(movie.id, movie.poster_path, movie.title);
                resultsContainer.appendChild(card);
            });
        }

        function createMovieCard(id, posterPath, title) {
            const div = document.createElement('div');
            div.className = 'movie-card';
            div.dataset.id = id;
            div.dataset.poster = posterPath;
            div.dataset.title = title;
            
            div.innerHTML = `
                <img src="${IMAGE_BASE_URL}${posterPath}" alt="${title}">
                <div class="title">${title}</div>
            `;
            return div;
        }

        // 3. 상태 저장 및 공유 (URL 파라미터)
        function saveStateToURL() {
            const state = {};
            document.querySelectorAll('.tier-content').forEach(tier => {
                const tierName = tier.dataset.tier;
                const movieIds = Array.from(tier.children).map(card => {
                    return `${card.dataset.id}|${card.dataset.poster}`;
                });
                if (movieIds.length > 0) state[tierName] = movieIds;
            });

            const encodedState = btoa(encodeURIComponent(JSON.stringify(state)));
            const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?data=${encodedState}`;
            window.history.replaceState({ path: newUrl }, '', newUrl);
        }

        // 4. URL에서 데이터 불러오기
        function loadStateFromURL() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (!data) return;

            try {
                const state = JSON.parse(decodeURIComponent(atob(data)));
                Object.keys(state).forEach(tierName => {
                    const container = document.querySelector(`[data-tier="${tierName}"]`);
                    state[tierName].forEach(movieData => {
                        const [id, poster] = movieData.split('|');
                        const card = createMovieCard(id, poster, '');
                        container.appendChild(card);
                    });
                });
            } catch (e) {
                console.error('데이터 로딩 실패', e);
            }
        }

        function copyShareLink() {
            saveStateToURL();
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('공유 링크가 클립보드에 복사되었습니다!');
            });
        }

        // 페이지 로드 시 실행
        window.onload = loadStateFromURL;

        // 엔터키 검색 지원
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovies();
        });
    </script>
</body>
</html>
