<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>영화 티어리스트 - Movie Tier Maker</title>
<style>
    :root{
        --bg-grad-start:#071025;
        --bg-grad-end:#0f1720;
        --muted:#96a0b4;
        --card-bg:#08131b;
        --panel-bg:linear-gradient(180deg,#071427,#071a2a);
        --gap:12px;
    }
    *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{
        margin:0;padding:20px;background:linear-gradient(180deg,var(--bg-grad-start),var(--bg-grad-end));color:#e6eef8;
    }
    header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
    header h1{margin:0;font-size:20px}
    header p{margin:0;color:var(--muted);font-size:13px}
    #share-btn{margin-left:auto;padding:8px 12px;border-radius:8px;border:none;background:#1f6feb;color:white;cursor:pointer}

    main{display:flex;flex-direction:column;gap:18px}
    #tier-board{display:flex;flex-direction:column;gap:10px}
    .tier-row{display:flex;align-items:flex-start;gap:10px}
    .tier-label{
        width:60px;min-width:60px;height:120px;display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:20px;border-radius:8px;color:#081021;
    }
    .s-tier{background:#ff6b6b}
    .a-tier{background:#ffb86b}
    .b-tier{background:#ffd86b;color:#081021}
    .c-tier{background:#9be67a;color:#081021}
    .d-tier{background:#7fb6ff;color:#081021}

    .tier-content{flex:1;min-height:120px;padding:10px;border-radius:8px;background:linear-gradient(180deg,#071427,#0b1b2a);display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;border:1px solid rgba(255,255,255,0.03)}
    .tier-content.drop-hover{outline:2px dashed rgba(255,255,255,0.08)}

    #search-area{padding:12px;border-radius:10px;background:var(--panel-bg);border:1px solid rgba(255,255,255,0.03)}
    .search-controls{display:flex;gap:8px;margin-bottom:10px}
    #search-input{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:white}
    #search-btn{padding:10px 14px;border-radius:8px;border:none;background:#1f6feb;color:white;cursor:pointer}

    .movie-card{width:80px;background:linear-gradient(180deg,#08131b,#061016);border-radius:6px;overflow:hidden;cursor:grab;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 12px rgba(2,6,23,0.6);text-align:center}
    .movie-card.dragging{opacity:0.5;transform:scale(0.98)}
    .movie-card img{width:80px;height:120px;object-fit:cover;display:block;background:#09121a}
    .movie-title{padding:6px 6px 8px;font-size:11px;color:var(--muted);height:36px;overflow:hidden}

    .placeholder-text{color:var(--muted);margin:8px 0}

    footer{margin-top:14px;color:var(--muted);font-size:12px}
    .small-note{font-size:12px;color:var(--muted);margin-top:8px}

    /* 반응형 간단 조정 */
    @media (max-width:720px){
        body{padding:12px}
        .tier-label{width:48px;height:96px;font-size:16px}
        .movie-card{width:64px}
        .movie-card img{width:64px;height:96px}
    }
</style>
</head>
<body>
    <header>
        <div>
            <h1>🎬 나만의 영화 티어리스트</h1>
            <p>검색한 영화를 드래그하여 S/A/B/C/D 칸에 배치하고 URL로 공유하세요.</p>
        </div>
        <button id="share-btn">🔗 공유 URL 복사</button>
    </header>

    <main>
        <!-- 티어 보드 -->
        <section id="tier-board" aria-label="티어 보드">
            <div class="tier-row">
                <div class="tier-label s-tier">S</div>
                <div class="tier-content drop-zone" id="tier-s" data-tier="s"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label a-tier">A</div>
                <div class="tier-content drop-zone" id="tier-a" data-tier="a"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label b-tier">B</div>
                <div class="tier-content drop-zone" id="tier-b" data-tier="b"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label c-tier">C</div>
                <div class="tier-content drop-zone" id="tier-c" data-tier="c"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label d-tier">D</div>
                <div class="tier-content drop-zone" id="tier-d" data-tier="d"></div>
            </div>
        </section>

        <!-- 검색 영역 -->
        <section id="search-area">
            <div class="search-controls">
                <input id="search-input" type="search" placeholder="영화 제목을 입력하세요 (예: 인셉션)" />
                <button id="search-btn">검색</button>
            </div>
            <div id="search-results" class="drop-zone" aria-live="polite">
                <p class="placeholder-text">영화를 검색하면 여기에 결과가 표시됩니다. (여기를 '창고'로 사용)</p>
            </div>
            <div class="small-note">TMDB API 키는 아래 스크립트의 TMDB_API_KEY 변수에 넣어주세요. (파일을 로컬에서 열 경우 검색이나 이미지 로딩에 브라우저 제한이 있을 수 있습니다.)</div>
        </section>
    </main>

    <footer>
        <div>Data provided by TMDB</div>
    </footer>

<script>
/*
  통합 HTML 파일입니다.
  - 외부 라이브러리 불필요: HTML5 Drag & Drop으로 구현
  - 기능: TMDB 검색, 드래그앤드롭, URL 상태 저장(쿼리파라미터), 공유(클립보드 복사)
  - 사용 방법: TMDB_API_KEY 변수에 발급받은 키를 넣으세요.
*/

/* ========== 설정 ========== */
const TMDB_API_KEY = 'YOUR_TMDB_API_KEY_HERE'; // <-- 여기에 TMDB API 키를 넣으세요.
const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w185';
/* ========================== */

const el = {
    searchInput: document.getElementById('search-input'),
    searchBtn: document.getElementById('search-btn'),
    searchResults: document.getElementById('search-results'),
    tiers: {
        s: document.getElementById('tier-s'),
        a: document.getElementById('tier-a'),
        b: document.getElementById('tier-b'),
        c: document.getElementById('tier-c'),
        d: document.getElementById('tier-d')
    },
    shareBtn: document.getElementById('share-btn')
};

let draggingEl = null; // 현재 드래그 중인 요소 참조

// 특정 movie id가 이미 페이지에 존재하는지 검사
function hasMovie(id){
    return !!document.querySelector(`[data-movie-id="${id}"]`);
}

// 영화 카드 생성 (movie: {id, title, poster_path})
function createMovieCard(movie){
    const id = String(movie.id);
    if (hasMovie(id)) return null;

    const wrap = document.createElement('div');
    wrap.className = 'movie-card';
    wrap.setAttribute('data-movie-id', id);
    wrap.setAttribute('draggable', 'true');
    wrap.title = movie.title || ('ID ' + id);

    const img = document.createElement('img');
    img.alt = movie.title || ('ID ' + id);
    if (movie.poster_path){
        img.src = TMDB_IMAGE_BASE + movie.poster_path;
    } else {
        // 간단한 SVG placeholder
        img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="120"><rect width="100%" height="100%" fill="#0a1220"/><text x="50%" y="55%" fill="#7b8aa3" font-size="10" font-family="Arial" text-anchor="middle">No Image</text></svg>`
        );
    }

    const title = document.createElement('div');
    title.className = 'movie-title';
    title.textContent = movie.title || ('ID ' + id);

    wrap.appendChild(img);
    wrap.appendChild(title);

    // Drag 이벤트 바인딩
    wrap.addEventListener('dragstart', (e) => {
        draggingEl = wrap;
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
        wrap.classList.add('dragging');
        // 일부 브라우저에서 ghost image 설정 (선택)
        try {
            const crt = wrap.cloneNode(true);
            crt.style.position = 'absolute';
            crt.style.top = '-1000px';
            crt.style.left = '-1000px';
            document.body.appendChild(crt);
            e.dataTransfer.setDragImage(crt, 40, 40);
            setTimeout(() => document.body.removeChild(crt), 0);
        } catch {}
    });

    wrap.addEventListener('dragend', () => {
        draggingEl = null;
        wrap.classList.remove('dragging');
        // 드래그 종료 후 URL 갱신
        updateURL();
    });

    // 더블클릭 시 TMDB 페이지 열기 (새 탭)
    wrap.addEventListener('dblclick', () => {
        const url = `https://www.themoviedb.org/movie/${id}`;
        window.open(url, '_blank');
    });

    return wrap;
}

// TMDB에서 영화 검색
async function searchMovies(query){
    if (!query || !query.trim()) return;
    el.searchResults.innerHTML = '<p class="placeholder-text">검색 중...</p>';
    if (!TMDB_API_KEY || TMDB_API_KEY === 'YOUR_TMDB_API_KEY_HERE'){
        el.searchResults.innerHTML = '<p class="placeholder-text">TMDB API 키가 설정되어 있지 않습니다. 파일 내 TMDB_API_KEY 변수에 키를 넣어주세요.</p>';
        return;
    }
    try {
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=ko-KR&page=1&include_adult=false&query=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('검색 실패: ' + res.status);
        const data = await res.json();
        const results = data.results || [];
        el.searchResults.innerHTML = '';
        if (results.length === 0){
            el.searchResults.innerHTML = '<p class="placeholder-text">검색 결과가 없습니다.</p>';
            updateURL();
            return;
        }
        for (const mv of results){
            const card = createMovieCard(mv);
            if (card) el.searchResults.appendChild(card);
        }
        updateURL();
    } catch (err){
        console.error(err);
        el.searchResults.innerHTML = '<p class="placeholder-text">검색 중 오류가 발생했습니다.</p>';
    }
}

// ID로 영화 상세 정보 가져오기 (URL 복원용)
async function fetchMovieById(id){
    if (!TMDB_API_KEY || TMDB_API_KEY === 'YOUR_TMDB_API_KEY_HERE'){
        // API 키가 없으면 최소한 제목 없이 스텁 카드 반환
        return { id: id, title: '영화 #' + id, poster_path: null };
    }
    try {
        const url = `https://api.themoviedb.org/3/movie/${encodeURIComponent(id)}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=ko-KR`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('영화 조회 실패');
        return await res.json();
    } catch (e){
        console.warn('영화 데이터 로드 실패(id=' + id + ')', e);
        return { id: id, title: '영화 #' + id, poster_path: null };
    }
}

// 드롭존 초기화 (모든 .drop-zone에 이벤트 바인딩)
function initDropZones(){
    const zones = document.querySelectorAll('.drop-zone');
    zones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            zone.classList.add('drop-hover');
        });
        zone.addEventListener('dragenter', (e) => {
            e.preventDefault();
            zone.classList.add('drop-hover');
        });
        zone.addEventListener('dragleave', () => {
            zone.classList.remove('drop-hover');
        });
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('drop-hover');
            const id = e.dataTransfer.getData('text/plain');
            // 우선 DOM에서 해당 요소 찾기
            const node = document.querySelector(`[data-movie-id="${id}"]`);
            if (node) {
                zone.appendChild(node);
                updateURL();
            } else {
                // 드래그 소스가 아닌 경우 (예: 외부에서 드롭) 무시
            }
        });
    });
}

// URL 업데이트: s,a,b,c,d,w 파라미터로 저장
function updateURL(){
    const params = new URLSearchParams();
    const map = { s: el.tiers.s, a: el.tiers.a, b: el.tiers.b, c: el.tiers.c, d: el.tiers.d };
    for (const [key, node] of Object.entries(map)){
        const ids = Array.from(node.querySelectorAll('[data-movie-id]')).map(n => n.getAttribute('data-movie-id'));
        if (ids.length) params.set(key, ids.join(','));
    }
    // 창고(검색결과)도 저장 (선택)
    const warehouseIds = Array.from(el.searchResults.querySelectorAll('[data-movie-id]')).map(n => n.getAttribute('data-movie-id'));
    if (warehouseIds.length) params.set('w', warehouseIds.join(','));

    // location.pathname 포함 (파일로 열면 전체 경로가 보이므로 공유 시에는 적절치 않을 수 있음)
    const base = location.pathname || '';
    const newUrl = base + (params.toString() ? '?' + params.toString() : '');
    try {
        history.replaceState(null, '', newUrl);
    } catch (e) {
        // 일부 환경(file://)에서 제약이 있을 수 있음: 무시
    }
}

// URL에서 상태 읽어서 복원
async function loadStateFromURL(){
    const params = new URLSearchParams(location.search);
    const keys = ['s','a','b','c','d','w'];
    for (const k of keys){
        if (!params.has(k)) continue;
        const raw = params.get(k);
        if (!raw) continue;
        const ids = raw.split(',').filter(Boolean);
        for (const id of ids){
            if (hasMovie(id)) continue;
            const mv = await fetchMovieById(id);
            const card = createMovieCard(mv);
            if (!card) continue;
            if (k === 'w'){
                el.searchResults.appendChild(card);
            } else {
                const target = el.tiers[k];
                if (target) target.appendChild(card);
            }
        }
    }
}

// 공유 버튼: 클립보드 복사 (fallback 포함)
async function copyCurrentURL(){
    const urlToCopy = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText){
        try {
            await navigator.clipboard.writeText(urlToCopy);
            return true;
        } catch (e){
            // 실패하면 아래 fallback으로
        }
    }
    // fallback: 임시 textarea
    try {
        const ta = document.createElement('textarea');
        ta.value = urlToCopy;
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
    } catch (e) {
        return false;
    }
}

// 이벤트 바인딩
el.searchBtn.addEventListener('click', () => searchMovies(el.searchInput.value));
el.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchMovies(el.searchInput.value); });

el.shareBtn.addEventListener('click', async () => {
    const ok = await copyCurrentURL();
    if (ok){
        const prev = el.shareBtn.textContent;
        el.shareBtn.textContent = '✅ 복사 완료';
        setTimeout(() => el.shareBtn.textContent = prev, 1500);
    } else {
        alert('URL 복사에 실패했습니다. 주소창에서 수동으로 복사해 주세요.');
    }
});

// 초기화
initDropZones();

// 로드 시 URL에서 상태 복원
window.addEventListener('load', async () => {
    // placeholder 제거(있으면)
    const ph = el.searchResults.querySelector('.placeholder-text');
    if (ph) ph.remove();
    await loadStateFromURL();
    updateURL();
});
</script>
</body>
</html>
